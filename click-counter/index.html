<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>전국민 클릭 챌린지</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="header">
    <h1>💥 전국민 클릭 챌린지</h1>
    <p>버튼을 눌러서 다 같이 목표를 채워봐요</p>
  </div>

  <div class="counter-panel">
    <div class="total-count" id="totalCount">0</div>
    <p class="goal-text" id="goalText">목표 1,000,000 클릭까지 0% 달성</p>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>

  <div class="click-stage" id="clickStage">
    <button class="big-button" id="bigButton" type="button">CLICK!</button>
  </div>

  <p class="status-note" id="statusNote"></p>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="ga.js"></script>
  <script src="supabase-client.js"></script>
  <script src="app.js"></script>
</body>
</html>
